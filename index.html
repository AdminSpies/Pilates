    .table{width:100%;border-collapse:separate;border-spacing:0 .65rem}.table th{text-align:left;font-size:.72rem;color:#7a7064;text-transform:uppercase;letter-spacing:.06em;padding:0 .8rem}.table td{background:#fffdf8;padding:.85rem .8rem;border-top:1px solid #eadfcf;border-bottom:1px solid #eadfcf}.table td:first-child{border-left:1px solid #eadfcf;border-radius:16px 0 0 16px}.table td:last-child{border-right:1px solid #eadfcf;border-radius:0 16px 16px 0}

<script>
const firebaseConfig = {

const FIRESTORE_DOC_PATH = 'appState/main';
let firestore = null;
let firebaseOnline = false;
let remoteLoaded = false;
let applyingRemote = false;
let unsubscribeRealtime = null;
const MAX_CUPO = 8;
const days = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const payMethods = ['Efectivo','Transferencia','Mercado Pago','Tarjeta','Otro'];
const initialData = {
  settings:{studioName:'Nihuen Pilates', allowPartialPaymentsView:false},
  users:[
    {id:uid(),apellido:'General',nombre:'Admin',dni:'10000000',fechaNacimiento:'1990-01-01',direccion:'-',telefono:'-',titulos:'Administración',usuario:'admin',passwordHash:'admin123',rol:'general',estado:'Activo',horariosAsignados:[],createdAt:now(),updatedAt:now()},
    {id:'u_profe',apellido:'Suárez',nombre:'Camila',dni:'30111222',fechaNacimiento:'1989-05-10',direccion:'Cipolletti',telefono:'2990000000',titulos:'Instructora Pilates Reformer',usuario:'profe',passwordHash:'profe123',rol:'parcial',estado:'Activo',horariosAsignados:[],createdAt:now(),updatedAt:now()}
  ],
  clients:[
    {id:'c1',apellido:'Pérez',nombre:'Laura',dni:'35111222',fechaNacimiento:'1994-03-10',telefono:'299111222',direccion:'Cipolletti',estado:'Activo',planId:'p2',fechaAlta:todayISO(),observaciones:'Sin lesiones reportadas',createdAt:now(),updatedAt:now()},
    {id:'c2',apellido:'Gómez',nombre:'Martina',dni:'36222333',fechaNacimiento:'1992-09-21',telefono:'299333444',direccion:'Neuquén',estado:'Activo',planId:'p3',fechaAlta:todayISO(),observaciones:'Prefiere horarios tarde',createdAt:now(),updatedAt:now()},
    {id:'c3',apellido:'Ruiz',nombre:'Sofía',dni:'37444555',fechaNacimiento:'1998-07-11',telefono:'299555666',direccion:'Cipolletti',estado:'Activo',planId:'p1',fechaAlta:todayISO(),observaciones:'Clase individual',createdAt:now(),updatedAt:now()}
  ],
  plans:[
    {id:'p1',nombre:'Clase individual',clasesSemanales:1,precio:8000,estado:'Activo',descripcion:'Una clase suelta',createdAt:now(),updatedAt:now()},
    {id:'p2',nombre:'1 vez por semana',clasesSemanales:1,precio:28000,estado:'Activo',descripcion:'Plan mensual básico',createdAt:now(),updatedAt:now()},
    {id:'p3',nombre:'2 veces por semana',clasesSemanales:2,precio:48000,estado:'Activo',descripcion:'Plan mensual intermedio',createdAt:now(),updatedAt:now()},
    {id:'p4',nombre:'3 veces por semana',clasesSemanales:3,precio:65000,estado:'Activo',descripcion:'Plan mensual avanzado',createdAt:now(),updatedAt:now()},
    {id:'p5',nombre:'4 veces por semana',clasesSemanales:4,precio:78000,estado:'Activo',descripcion:'Plan mensual intensivo',createdAt:now(),updatedAt:now()}
  ],
  classes:[
    {id:'cl1',dia:'Lunes',hora:'08:00',personalId:'u_profe',clientesIds:['c1','c2'],cupoMaximo:8,estado:'Activa',observaciones:'',createdAt:now(),updatedAt:now()},
    {id:'cl2',dia:'Miércoles',hora:'18:00',personalId:'u_profe',clientesIds:['c2'],cupoMaximo:8,estado:'Activa',observaciones:'',createdAt:now(),updatedAt:now()}
  ],
  schedules:[],
  payments:[
    {id:'pay1',clienteId:'c1',planId:'p2',monto:28000,fechaPago:todayISO(),mesAbonado:monthKey(),medioPago:'Transferencia',estado:'Pagado',observaciones:'',registradoPor:'admin',createdAt:now(),updatedAt:now()},
    {id:'pay2',clienteId:'c2',planId:'p3',monto:48000,fechaPago:'',mesAbonado:monthKey(),medioPago:'Mercado Pago',estado:'Pendiente',observaciones:'',registradoPor:'admin',createdAt:now(),updatedAt:now()}
  ]
};
let db = loadDB();
let currentUser = null;
let currentSection = 'dashboard';
let filters = {};

function uid(){return 'id_'+Math.random().toString(36).slice(2,10)+'_'+Date.now().toString(36)}
function now(){return new Date().toISOString()}
function todayISO(){return new Date().toISOString().slice(0,10)}
function monthKey(d=new Date()){return d.toISOString().slice(0,7)}
function money(n){return '$ '+Number(n||0).toLocaleString('es-AR')}
function normalizeDB(data){
  const base = structuredClone(initialData);
  const merged = {...base, ...(data || {})};
  merged.settings = {...base.settings, ...(data?.settings || {})};
  ['users','clients','plans','classes','schedules','payments'].forEach(k=>{
    if(!Array.isArray(merged[k])) merged[k] = [];
  });
  if(!merged.schedules.length && merged.classes.length) merged.schedules = buildSchedules(merged);
  return merged;
}
function saveLocal(){localStorage.setItem('nihuenPilatesDB',JSON.stringify(db))}
function saveDB(){
  saveLocal();
  if(firebaseOnline && firestore && !applyingRemote){
    firestore.doc(FIRESTORE_DOC_PATH).set({
      payload: JSON.parse(JSON.stringify(db)),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    },{merge:false}).catch(err=>{
      console.error('Firestore save error',err);
      toast('No se pudo guardar en Firebase. Revisar reglas de Firestore.');
    });
  }
}
function loadDB(){
  const raw=localStorage.getItem('nihuenPilatesDB');
  if(raw){try{return normalizeDB(JSON.parse(raw))}catch(e){}}
  const copy=structuredClone(initialData);
  copy.schedules = buildSchedules(copy);
  localStorage.setItem('nihuenPilatesDB',JSON.stringify(copy));
  return copy;
}
async function initFirebaseRealtime(){
  try{
    if(!window.firebase) throw new Error('Firebase SDK no cargó');
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    firestore = firebase.firestore();
    firebaseOnline = true;
    try{await firestore.enablePersistence({synchronizeTabs:true})}catch(e){console.warn('Persistencia local Firebase no disponible',e?.code||e)}
    subscribeRealtime();
  }catch(err){
    console.error('Firebase init error',err);
    firebaseOnline = false;
    toast('Firebase no inició. La app queda en modo local.');
  }
}
function subscribeRealtime(){
  if(!firestore) return;
  if(unsubscribeRealtime) unsubscribeRealtime();
  unsubscribeRealtime = firestore.doc(FIRESTORE_DOC_PATH).onSnapshot(async snap=>{
    if(!snap.exists){
      const seed = normalizeDB(db);
      await firestore.doc(FIRESTORE_DOC_PATH).set({payload:seed,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:false});
      return;
    }
    const remote = snap.data()?.payload;
    if(!remote) return;
    applyingRemote = true;
    db = normalizeDB(remote);
    saveLocal();
    applyingRemote = false;
    remoteLoaded = true;
    if(currentUser){
      const freshUser = db.users.find(u=>u.id===currentUser.id || u.usuario===currentUser.usuario);
      if(!freshUser || freshUser.estado!=='Activo'){
        currentUser=null;
        document.getElementById('appView').classList.add('hidden');
        document.getElementById('loginView').classList.remove('hidden');
        toast('La sesión fue cerrada porque el usuario cambió o fue dado de baja.');
      }else{
        currentUser=freshUser;
        render();
      }
    }
  },err=>{
    console.error('Firestore realtime error',err);
    toast('Sin sincronización en tiempo real. Revisar permisos de Firestore.');
  });
}
function buildSchedules(data){return data.classes.flatMap(cl=>cl.clientesIds.map(cid=>({id:uid(),clienteId:cid,personalId:cl.personalId,dia:cl.dia,horario:cl.hora,claseId:cl.id,estado:cl.estado==='Activa'?'Activo':'Cancelado',createdAt:now(),updatedAt:now()})))}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function isGeneral(){return currentUser?.rol==='general'}
function canViewPayments(){return isGeneral() || db.settings.allowPartialPaymentsView}
function canSeeClass(cl){return isGeneral() || cl.personalId===currentUser.id}
function getClient(id){return db.clients.find(x=>x.id===id)}
function getUser(id){return db.users.find(x=>x.id===id)}
function getPlan(id){return db.plans.find(x=>x.id===id)}
function visibleClasses(){return db.classes.filter(canSeeClass)}
function visibleClients(){if(isGeneral())return db.clients; const ids=new Set(visibleClasses().flatMap(c=>c.clientesIds)); return db.clients.filter(c=>ids.has(c.id))}
function statusBadge(s){const map={Activo:'badge-ok',Activa:'badge-ok',Pagado:'badge-ok',Pendiente:'badge-warn',Vencido:'badge-danger',Parcial:'badge-warn',Inactivo:'badge-muted',Cancelada:'badge-danger',Cancelado:'badge-danger',Finalizada:'badge-muted',Reprogramado:'badge-warn'};return `<span class="badge ${map[s]||'badge-muted'}">${s}</span>`}
function cupoBadge(cl){const used=cl.clientesIds.length; return `<span class="badge ${used>=MAX_CUPO?'badge-full':'badge-gold'}">${used}/${MAX_CUPO}${used>=MAX_CUPO?' Completo':''}</span>`}
function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function matchesText(obj,q,fields){if(!q)return true;const n=normalize(q);return fields.some(f=>normalize(obj[f]).includes(n))}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openModal(title,subtitle,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalSubtitle').textContent=subtitle||'';document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}

const sections = [
  ['dashboard','Dashboard','Resumen general','◦'],['clientes','Clientes','Altas, bajas y modificaciones','◦'],['personal','Personal','Usuarios y profesores','◦'],['planes','Planes y precios','Configuración de planes','◦'],['clases','Clases','Cupos y alumnos','◦'],['horarios','Horarios','Asignaciones por alumno','◦'],['pagos','Pagos','Estado mensual','◦'],['agenda','Agenda semanal','Vista por día y hora','◦'],['reportes','Reportes','Indicadores principales','◦'],['config','Configuración','Datos generales','◦'],['perfil','Perfil de usuario','Sesión actual','◦']
];
function allowedSections(){return isGeneral()?sections:sections.filter(s=>!['personal','planes','reportes','config'].includes(s[0]) && (s[0]!=='pagos'||canViewPayments()))}
function renderNav(){document.getElementById('nav').innerHTML=allowedSections().map(([id,name,,icon])=>`<button class="tab ${currentSection===id?'active':''}" onclick="go('${id}')"><span>${icon}</span><span>${name}</span></button>`).join('')}
function go(id){currentSection=id;filters={};document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');render()}
function render(){
  if(!currentUser)return;
  const meta=sections.find(s=>s[0]===currentSection)||sections[0];
  document.getElementById('pageTitle').textContent=meta[1];document.getElementById('pageSubtitle').textContent=meta[2];
  document.getElementById('userName').textContent=currentUser.nombre+' '+currentUser.apellido;document.getElementById('todayText').textContent=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'});
  document.getElementById('roleText').textContent=isGeneral()?'Administrador general':'Administrador parcial';
  renderNav();
  const map={dashboard:renderDashboard,clientes:renderClientes,personal:renderPersonal,planes:renderPlanes,clases:renderClases,horarios:renderHorarios,pagos:renderPagos,agenda:renderAgenda,reportes:renderReportes,config:renderConfig,perfil:renderPerfil};
  document.getElementById('content').innerHTML=(map[currentSection]||renderDashboard)();
}
function stat(label,value,sub){return `<div class="card p-5"><div class="text-sm font-extrabold text-[#7d7466]">${label}</div><div class="mt-2 text-3xl font-black">${value}</div>${sub?`<div class="mt-1 text-xs font-bold text-[#8a8176]">${sub}</div>`:''}</div>`}
function renderDashboard(){
  const activeClients=db.clients.filter(c=>c.estado==='Activo').length;
  const activeUsers=db.users.filter(u=>u.estado==='Activo').length;
  const todayName=new Date().toLocaleDateString('es-AR',{weekday:'long'}).replace(/^./,m=>m.toUpperCase());
  const dayClasses=visibleClasses().filter(c=>c.dia===todayName&&c.estado==='Activa');
  const cupos=dayClasses.reduce((a,c)=>a+(MAX_CUPO-c.clientesIds.length),0);
  const pending=db.payments.filter(p=>p.estado==='Pendiente').length;
  const overdue=db.payments.filter(p=>p.estado==='Vencido').length;
  const monthIncome=db.payments.filter(p=>p.estado==='Pagado'&&p.mesAbonado===monthKey()).reduce((a,p)=>a+Number(p.monto),0);
  const full=visibleClasses().filter(c=>c.clientesIds.length>=MAX_CUPO).length;
  return `<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
    ${stat('Clientes activos',activeClients,'Total de alumnos activos')}${stat('Personal activo',activeUsers,'Administración y profesores')}${stat('Clases del día',dayClasses.length,'Según agenda visible')}${stat('Cupos disponibles hoy',cupos,'Capacidad máxima 8 por clase')}${canViewPayments()?stat('Pagos pendientes',pending,'Mes actual y anteriores'):''}${canViewPayments()?stat('Pagos vencidos',overdue,'Revisar cobros'):''}${canViewPayments()?stat('Ingresos del mes',money(monthIncome),'Pagos registrados como pagados'):''}${stat('Horarios completos',full,'Clases con 8/8')}
  </div>
  <div class="mt-5 grid gap-4 xl:grid-cols-3">
    <div class="card p-5 xl:col-span-2"><h3 class="mb-4 text-xl font-black">Próximas clases</h3>${classList(visibleClasses().filter(c=>c.estado==='Activa').slice(0,6))}</div>
    <div class="card p-5"><h3 class="mb-4 text-xl font-black">Accesos rápidos</h3><div class="grid gap-3">
      ${isGeneral()?'<button onclick="newClient()" class="btn btn-primary">Nuevo cliente</button><button onclick="newPayment()" class="btn btn-gold">Nuevo pago</button><button onclick="newClass()" class="btn btn-soft">Nueva clase</button><button onclick="newUser()" class="btn btn-soft">Nuevo personal</button>':'<button onclick="go(\'clases\')" class="btn btn-primary">Ver mis clases</button>'}
      <button onclick="go('agenda')" class="btn btn-soft">Ver agenda semanal</button>
      ${canViewPayments()?'<button onclick="go(\'pagos\')" class="btn btn-soft">Ver pagos pendientes</button>':''}
    </div></div>
  </div>`
}

function classForm(cl={}){const activeUsers=db.users.filter(u=>u.estado==='Activo'); return `<form onsubmit="saveClass(event,'${cl.id||''}')">${formGrid([{label:'Día',html:`<select required name="dia" class="input"><option value="">Seleccionar</option>${days.map(d=>`<option ${cl.dia===d?'selected':''}>${d}</option>`).join('')}</select>`},{label:'Hora',html:`<input required type="time" name="hora" class="input" value="${cl.hora||''}">`},{label:'Personal a cargo',html:`<select required name="personalId" class="input">${activeUsers.map(u=>`<option value="${u.id}" ${cl.personalId===u.id?'selected':''}>${u.nombre} ${u.apellido}</option>`).join('')}</select>`},{label:'Estado',html:`<select name="estado" class="input"><option ${cl.estado==='Activa'?'selected':''}>Activa</option><option ${cl.estado==='Cancelada'?'selected':''}>Cancelada</option><option ${cl.estado==='Finalizada'?'selected':''}>Finalizada</option></select>`},{label:'Observaciones',full:true,html:`<textarea name="observaciones" class="input">${cl.observaciones||''}</textarea>`}])}<button class="btn btn-primary mt-5">Guardar</button></form>`}
function newClass(){openModal('Nueva clase','Crear día y horario',classForm())}
function editClass(id){const cl=db.classes.find(c=>c.id===id); if(!isGeneral()&&cl.personalId!==currentUser.id)return toast('No podés modificar horarios ajenos'); openModal('Editar clase','Modificar clase',classForm(cl))}
function saveClass(e,id){e.preventDefault(); const fd=Object.fromEntries(new FormData(e.target).entries()); if(!fd.dia||!fd.hora)return toast('Día y hora obligatorios'); if(!fd.personalId)return toast('La clase debe tener personal asignado'); if(!isGeneral()){const cl=db.classes.find(c=>c.id===id); if(!cl||cl.personalId!==currentUser.id)return toast('Permiso denegado')} if(id){const cl=db.classes.find(c=>c.id===id); Object.assign(cl,fd,{updatedAt:now()}); syncSchedules()}else{if(!isGeneral())return toast('Solo el administrador general puede crear clases'); db.classes.push({id:uid(),...fd,clientesIds:[],cupoMaximo:MAX_CUPO,createdAt:now(),updatedAt:now()})} saveDB();closeModal();render();toast('Clase guardada')}
function viewClass(id){const cl=db.classes.find(c=>c.id===id); openModal('Detalle de clase',`${cl.dia} ${cl.hora}`,`<div class="space-y-4"><div class="card p-4"><p><b>Profesor:</b> ${userName(cl.personalId)}</p><p><b>Cupo:</b> ${cl.clientesIds.length}/${MAX_CUPO}</p><p><b>Estado:</b> ${cl.estado}</p></div><div class="card p-4"><b>Alumnos</b><div class="mt-3 space-y-2">${cl.clientesIds.map(cid=>`<div class="flex items-center justify-between gap-2 rounded-2xl bg-[#f7efe2] p-3"><span>${clientName(cid)}</span>${(isGeneral()||cl.personalId===currentUser.id)?`<button class="btn btn-danger !w-auto !px-3 !py-2" onclick="removeClientFromClass('${cl.id}','${cid}')">Quitar</button>`:''}</div>`).join('')||'Sin alumnos'}</div></div>${(isGeneral()||cl.personalId===currentUser.id)?`<button onclick="assignClient('${cl.id}')" class="btn btn-primary">Agregar cliente</button>`:''}</div>`)}
function assignClient(id){const cl=db.classes.find(c=>c.id===id); if(!isGeneral()&&cl.personalId!==currentUser.id)return toast('No podés modificar horarios ajenos'); const opts=visibleClients().filter(c=>c.estado==='Activo'&&!cl.clientesIds.includes(c.id)).map(c=>`<option value="${c.id}">${c.nombre} ${c.apellido} · ${getPlan(c.planId)?.nombre||'-'}</option>`).join(''); openModal('Asignar cliente','Validación de cupo y plan',`<form onsubmit="addClientToClass(event,'${id}')"><label class="label">Cliente</label><select required name="clienteId" class="input"><option value="">Seleccionar cliente</option>${opts}</select><button class="btn btn-primary mt-5">Asignar</button></form>`)}
function addClientToClass(e,id){e.preventDefault(); const cid=new FormData(e.target).get('clienteId'); const cl=db.classes.find(c=>c.id===id); const validation=canAssignClient(cid,cl); if(validation!==true)return toast(validation); cl.clientesIds.push(cid); cl.updatedAt=now(); syncSchedules(); saveDB(); closeModal(); render(); toast('Cliente asignado')}
function removeClientFromClass(clid,cid){const cl=db.classes.find(c=>c.id===clid); if(!isGeneral()&&cl.personalId!==currentUser.id)return; cl.clientesIds=cl.clientesIds.filter(id=>id!==cid); syncSchedules(); saveDB(); closeModal(); viewClass(clid); render(); toast('Cliente quitado')}
function canAssignClient(cid,cl){if(cl.clientesIds.length>=MAX_CUPO)return 'El horario está completo'; if(cl.clientesIds.includes(cid))return 'El cliente ya está asignado'; const client=getClient(cid); if(!client.planId)return 'El cliente debe tener plan asignado'; const plan=getPlan(client.planId); const weekly=db.classes.filter(c=>c.clientesIds.includes(cid)&&c.estado==='Activa').length; if(weekly>=Number(plan?.clasesSemanales||0))return 'El cliente supera la cantidad de clases semanales de su plan'; return true}
function syncSchedules(){db.schedules=buildSchedules(db)}

function paymentForm(p={}){return `<form onsubmit="savePayment(event,'${p.id||''}')">${formGrid([{label:'Cliente',html:`<select required name="clienteId" class="input" onchange="fillPlanAndAmount(this.value)"><option value="">Seleccionar</option>${db.clients.map(c=>`<option value="${c.id}" ${p.clienteId===c.id?'selected':''}>${c.nombre} ${c.apellido}</option>`).join('')}</select>`},{label:'Plan',html:`<select required id="payPlan" name="planId" class="input">${db.plans.map(pl=>`<option value="${pl.id}" ${p.planId===pl.id?'selected':''}>${pl.nombre}</option>`).join('')}</select>`},{label:'Monto',html:`<input required id="payAmount" type="number" name="monto" class="input" value="${p.monto||0}">`},{label:'Fecha de pago',html:`<input type="date" name="fechaPago" class="input" value="${p.fechaPago||todayISO()}">`},{label:'Mes abonado',html:`<input required type="month" name="mesAbonado" class="input" value="${p.mesAbonado||monthKey()}">`},{label:'Medio de pago',html:`<select name="medioPago" class="input">${payMethods.map(m=>`<option ${p.medioPago===m?'selected':''}>${m}</option>`).join('')}</select>`},{label:'Estado',html:`<select name="estado" class="input"><option ${p.estado==='Pagado'?'selected':''}>Pagado</option><option ${p.estado==='Pendiente'?'selected':''}>Pendiente</option><option ${p.estado==='Vencido'?'selected':''}>Vencido</option><option ${p.estado==='Parcial'?'selected':''}>Parcial</option></select>`},{label:'Observaciones',full:true,html:`<textarea name="observaciones" class="input">${p.observaciones||''}</textarea>`}])}<button class="btn btn-primary mt-5">Guardar</button></form>`}
function fillPlanAndAmount(cid){const c=getClient(cid); if(!c)return; const p=getPlan(c.planId); document.getElementById('payPlan').value=p.id; document.getElementById('payAmount').value=p.precio}
function newPayment(){openModal('Nuevo pago','Registrar pago mensual',paymentForm())}
function editPayment(id){openModal('Editar pago','Modificar pago',paymentForm(db.payments.find(p=>p.id===id)))}
function savePayment(e,id){e.preventDefault(); if(!isGeneral())return toast('Solo administrador general'); const fd=Object.fromEntries(new FormData(e.target).entries()); fd.monto=Number(fd.monto); fd.registradoPor=currentUser.usuario; if(id){Object.assign(db.payments.find(p=>p.id===id),fd,{updatedAt:now()})}else{db.payments.push({id:uid(),...fd,createdAt:now(),updatedAt:now()})} saveDB();closeModal();render();toast('Pago guardado')}
function deletePayment(id){if(!isGeneral())return toast('Solo administrador general'); if(!confirm('Confirmar eliminación de pago'))return; db.payments=db.payments.filter(p=>p.id!==id);saveDB();render();toast('Pago eliminado')}
function saveSettings(e){e.preventDefault(); const fd=Object.fromEntries(new FormData(e.target).entries()); db.settings.studioName=fd.studioName; db.settings.allowPartialPaymentsView=fd.allowPartialPaymentsView==='true'; saveDB(); render(); toast('Configuración guardada')}

function resetDemo(){localStorage.removeItem('nihuenPilatesDB'); db=normalizeDB(structuredClone(initialData)); db.schedules=buildSchedules(db); saveDB(); render(); toast('Datos reiniciados')}

document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const user=document.getElementById('loginUser').value.trim();const pass=document.getElementById('loginPass').value;const found=db.users.find(u=>u.usuario===user&&u.passwordHash===pass&&u.estado==='Activo'); if(!found){document.getElementById('loginError').classList.remove('hidden');return} currentUser=found;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');currentSection='dashboard';render()});
document.getElementById('logoutBtn').onclick=()=>{currentUser=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden')};
document.getElementById('menuBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')};
document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')};
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
initFirebaseRealtime().then(()=>{const el=document.getElementById('syncStatus'); if(el) el.textContent=firebaseOnline?'Firebase conectado: sincronización activa':'Modo local sin Firebase';});
</script>
